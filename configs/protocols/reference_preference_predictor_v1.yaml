schema_version: 1
protocol_id: PROTO-REFERENCE-PREFERENCE-PREDICTOR-V1
title: Predicting Absolute-versus-Relative preference from acoustic and class statistics

research_question_scope: >
  Test whether corpus/attribute/emotion reference-frame preference can be predicted from simple
  pre-model acoustic and class-distribution statistics, rather than selected post hoc from
  downstream performance.

scope_note: >
  The 75 target effect sizes already exist from EXP-09/10. This is therefore a cross-validated
  predictive follow-up, not a prospectively blinded external validation.

target:
  regression: Relative-minus-Absolute speaker-balanced F1
  classification: sign(Relative-minus-Absolute F1)
  resolved_sign_subset: 95% CI excludes zero

cells:
  corpora: [esd_english, mead_part0, ravdess_speech, msp, meld]
  attributes: [pitch, loudness, rate]
  emotions: [angry, happy, neutral, sad, surprise]
  expected_cells: 75

predictor_families:
  labels_only:
    categorical: [attribute, emotion]
  stats_only:
    numeric:
      - class_prevalence
      - speaker_coverage
      - absolute_effect_signed
      - relative_effect_signed
      - baseline_effect_signed
      - absolute_effect_abs
      - relative_effect_abs
      - baseline_effect_abs
      - relative_minus_absolute_separation
      - baseline_prior_corr
      - between_baseline_to_within_relative_sd_ratio
      - conflict_fraction
  combined:
    categorical: [attribute, emotion]
    numeric: same_as_stats_only

controls:
  - Numeric statistics are computed only from the raw acoustic/label table, never from model predictions.
  - Speaker-balanced weighted class effect sizes are used so large speakers do not dominate.
  - Natural-corpus filters match EXP-09/10.
  - Leave-one-corpus-out uses four corpora for training and one unseen corpus for testing.
  - Leave-one-attribute-out uses two attributes for training and one unseen attribute for testing.
  - Standardization and categorical encoding are fit on training cells only.
  - Regression model is fixed Ridge(alpha=10).
  - Sign classifier is fixed LogisticRegression(C=1, class_weight=balanced).
  - No feature selection or hyperparameter tuning after seeing cross-validation performance.

metrics:
  regression: [mae, spearman_r]
  sign: [accuracy_all, accuracy_resolved, balanced_accuracy_resolved]

criteria:
  acceptance:
    - >
      Corpus-general predictive utility is supported if the combined leave-one-corpus-out model
      reaches pooled Spearman r >= 0.45 and MAE <= 0.85 times the labels-only MAE.
    - >
      Direction prediction is supported if combined leave-one-corpus-out resolved-sign accuracy
      is >= 0.70 and at least 0.05 above labels-only.
    - >
      Attribute-general structure is supported if the combined leave-one-attribute-out model
      achieves resolved-sign accuracy >= 0.65 on at least two of the three held-out attributes.
  rejection:
    - >
      Reject useful predictive structure if combined leave-one-corpus-out Spearman r < 0.20,
      combined resolved-sign accuracy <= labels-only, and no held-out attribute reaches 0.60
      resolved-sign accuracy.
  inconclusive:
    - Otherwise mark unsupported sub-hypotheses inconclusive.

required_outputs:
  - artifacts/EXP-20260920-11/effect_matrix.csv
  - artifacts/EXP-20260920-11/predictor_features.csv
  - artifacts/EXP-20260920-11/loco_predictions.csv
  - artifacts/EXP-20260920-11/loco_metrics.csv
  - artifacts/EXP-20260920-11/loao_predictions.csv
  - artifacts/EXP-20260920-11/loao_metrics.csv
  - artifacts/EXP-20260920-11/run_metadata.json

required_audits:
  - Confirm exactly 75 unique cells.
  - Confirm feature computation uses no downstream predictions.
  - Confirm held-out corpus/attribute cells are absent from training folds.
  - Confirm every model family emits one prediction per held-out cell.
  - Confirm resolved-sign evaluation uses preregistered existing confidence intervals only.
