schema_version: 1
protocol_id: PROTO-IEMOCAP-SESSION-LOSO-ARH-LSQR-HIGHPRECISION-V1
title: High-precision LSQR sensitivity for session-disjoint ARH attribution
parents: [EXP-20260924-07, EXP-20260924-08, EXP-20260923-08]
change:
  ridge_solver: lsqr
  ridge_tol: 1.0e-10
fixed:
  task: raw absolute IEMOCAP Arousal/Dominance
  folds: five strict leave-one-session-out folds
  backbones: [wavlm_layer12, wavlm_layer24, emotion2vec_plus_large, hubert_base_ls960, wav2vec2_base]
  ridge_alpha: 1.0
  representations: [absolute, relative, hybrid]
  bootstrap_unit: speaker
  bootstrap_reps: 10000
criteria:
  pass:
    - all 6 reference significant Relative-minus-Absolute Between-minus-Within effects preserve sign
    - Hybrid-minus-Relative remains below the 6/10 significant-positive threshold
    - max absolute component CCC discrepancy versus EXP-20260924-07 is smaller than in default-tolerance LSQR EXP-20260924-08
  mixed:
    - mechanism signs remain but numerical component discrepancies remain large
  reject:
    - reference mechanism directions broadly reverse
