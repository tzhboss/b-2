schema_version: 1
protocol_id: PROTO-IEMOCAP-WAVLM-SOLVER-SENSITIVITY-V1
title: Numerical solver sensitivity for WavLM target-reference intervention

research_question_scope: >
  Check whether the WavLM target-reference effect from EXP-20260921-16 is robust to replacing
  scikit-learn Ridge's default solver with the numerically stable LSQR solver.

dataset: iemocap
embedding_source: artifacts/EXP-20260921-16/embeddings
layers: [12,24]
targets: [arousal,dominance]
lambda_values: [0.0,0.25,0.5,0.75,1.0]
representations: [absolute,relative,hybrid]

model:
  estimator: Ridge
  alpha: 1.0
  solver: lsqr
  scaling: train-only weighted StandardScaler

evaluation:
  split_seed: 20260920
  outer_folds: 5
  speaker_bootstrap_reps: 5000
  bootstrap_unit: speaker

criteria:
  acceptance:
    - >
      Solver robustness is supported if all four Arousal/Dominance layer-by-target
      Relative-minus-Absolute slopes remain negative and all four lambda=0 effects remain positive.
    - >
      Quantitative stability is supported if the absolute slope change versus EXP-20260921-16 is
      <=0.02 in all four cells.
  rejection:
    - >
      Reject numerical robustness if either target reverses slope sign at both layers under LSQR.
  inconclusive:
    - Otherwise mark quantitative stability inconclusive.

required_outputs:
  - artifacts/EXP-20260921-17/point_effects.csv
  - artifacts/EXP-20260921-17/cluster_bootstrap_slopes.csv
  - artifacts/EXP-20260921-17/comparison_to_exp16.csv
  - artifacts/EXP-20260921-17/run_metadata.json
