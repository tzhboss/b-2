schema_version: 1
protocol_id: PROTO-UNSEEN-SPEAKER-KSHOT-PITCH-V1
title: Label-free K-shot speaker-reference estimation for relative pitch

research_question_scope: >
  Test whether speaker-relative pitch remains useful for emotion classification under
  speaker-disjoint evaluation when the test speaker baseline is not known and must be estimated
  from a small label-free enrollment set.

allowed_datasets: [esd_english, mead_part0, ravdess_speech]

controls:
  - Use explicit pitch only to isolate the reference-frame mechanism.
  - Use speaker-disjoint outer folds.
  - Each speaker contributes a label-free enrollment subset sampled without using emotion labels.
  - Enrollment utterances are excluded from downstream classifier training/evaluation.
  - The same enrollment and same remaining rows are used for Absolute, Oracle-relative, K-shot-relative, and Hybrid comparisons within each K/seed/fold.
  - Train speakers and held-out test speakers both use the same K-shot estimation procedure for K-shot conditions.
  - Oracle-relative uses the precomputed speaker reference only as an upper-bound condition.
  - Same LogisticRegression classifier, class weighting, and train-only StandardScaler for every condition.

forbidden_uses:
  - Do not use emotion labels to choose enrollment utterances.
  - Do not use held-out test evaluation utterances to estimate the test speaker baseline.
  - Do not tune K after inspecting results; K values are fixed at [1,2,5,10].
  - Do not merge emotion labels across corpora; evaluate each corpus separately.
  - Do not claim unseen-speaker deployment for WavLM from this explicit-prosody experiment.

changed_factors:
  - reference_condition: [absolute, oracle_relative, kshot_relative, oracle_hybrid, kshot_hybrid]
  - K: [1,2,5,10]

metrics:
  primary: [macro_f1]
  secondary:
    - balanced_accuracy
    - accuracy
    - baseline_mae_semitone
    - baseline_abs_error_median_semitone
    - paired_macro_f1_delta

splits:
  outer_folds: 5
  speaker_disjoint: true
  seeds: [20260920,20260921,20260922]

criteria:
  acceptance:
    - >
      K-shot reference estimation is supported if K=10 reduces mean absolute baseline error
      relative to K=1 by at least 25% in all three datasets.
    - >
      Downstream utility is supported if K=10 K-shot-relative exceeds matched Absolute by at
      least 0.01 macro-F1 with paired-bootstrap 95% CI above zero in at least two datasets.
    - >
      Practical recovery is supported if K=10 K-shot-relative is within 0.02 macro-F1 of the
      Oracle-relative upper bound in at least two datasets.
  rejection:
    - >
      Reject useful label-free K-shot recovery if K=10 fails to reduce baseline MAE relative to
      K=1 in at least two datasets and K=10 K-shot-relative fails to beat matched Absolute in all datasets.
  inconclusive:
    - Otherwise mark inconclusive.

required_outputs:
  - artifacts/EXP-20260920-05/baseline_estimation_by_speaker.csv
  - artifacts/EXP-20260920-05/metrics_by_fold.csv
  - artifacts/EXP-20260920-05/summary.csv
  - artifacts/EXP-20260920-05/paired_deltas.csv
  - artifacts/EXP-20260920-05/baseline_summary.csv
  - artifacts/EXP-20260920-05/run_metadata.json

required_audits:
  - Confirm outer train/test speaker overlap is zero.
  - Confirm enrollment/evaluation row overlap is zero for every speaker and K.
  - Confirm enrollment selection does not use emotion labels.
  - Confirm matched row identity across all representation conditions within each K/seed/fold.
  - Confirm full class coverage in every train/test fold.
  - Confirm all seeds, folds, and K values completed.
