title: Published continuous-SER factor-analysis normalization under component attribution
research_question: >
  When the Dang et al. 2016 factor-analysis speaker-normalization mechanism is applied to the same
  standard absolute MSP VAD task, does its Overall effect arise from a distinct Between/Within trade-off?
registered_hypothesis: >
  Speaker-factor subtraction will affect Between-speaker calibration more strongly than
  within-speaker centered tracking, so Overall CCC alone will not fully describe the method's effect.
