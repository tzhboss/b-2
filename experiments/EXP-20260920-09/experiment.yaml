experiment_id: EXP-20260920-09
title: Which emotions prefer absolute or relative pitch?

research_question: >
  Which emotion labels drive the corpus-dependent Absolute-versus-Relative pitch effect, and what
  happens when absolute and speaker-relative pitch directions explicitly conflict?

registered_hypothesis: >
  Reference-frame preference will be emotion-specific rather than uniform. MSP's baseline utility
  will be concentrated in a subset of emotion labels, while controlled corpora will show stronger
  Relative advantages for high-arousal emotions. Conflict utterances will amplify the difference
  between Absolute and Relative representations.

