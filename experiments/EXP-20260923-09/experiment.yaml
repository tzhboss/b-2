title: Published PLDC mechanism under Overall/Between/Within attribution
research_question: >
  When a published continuous-SER personalization/calibration mechanism is applied to the unchanged
  absolute VAD task, which component of performance does it alter?
registered_hypothesis: >
  Mu-only and sigma-only calibration will produce different component profiles: mu shift leaves the
  within-centered metric unchanged by construction while altering speaker-level calibration; sigma
  shift preserves per-speaker prediction means while altering within-speaker variation.
