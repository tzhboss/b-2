title: Are reference-frame effects robust to nonlinear classifiers?

research_question: >
  Do the corpus- and attribute-dependent Absolute-versus-Relative effects survive when replacing
  linear LogisticRegression with a fixed nonlinear HistGradientBoosting classifier?

registered_hypothesis: >
  The exact F1 values will change, but the sign and relative ordering of reference-frame effects
  will remain substantially stable across classifier families.

