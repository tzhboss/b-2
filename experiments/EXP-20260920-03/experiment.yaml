schema_version: 1

experiment_id: EXP-20260920-03
title: Frozen WavLM-large plus absolute versus speaker-relative prosody

research_question: >
  After conditioning on frozen WavLM-large speech embeddings, does explicit speaker-relative
  prosody still provide task- and attribute-dependent information relative to explicit absolute
  prosody?
registered_hypothesis: >
  The pitch reference-frame reversal observed in EXP-20260920-02 will remain detectable after
  adding explicit prosody to frozen WavLM-large: WavLM plus speaker-relative pitch will outperform
  WavLM plus absolute pitch for emotion, while WavLM plus absolute pitch will outperform WavLM
  plus speaker-relative pitch for gender. The effect is expected to be smaller than in the
  prosody-only probe because WavLM already encodes both state and speaker information. Hybrid
  augmentation may recover additional trait information but is not required for hypothesis pass.

