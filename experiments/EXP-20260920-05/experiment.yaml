experiment_id: EXP-20260920-05
title: Unseen-speaker K-shot pitch reference estimation

research_question: >
  Can speaker-relative pitch improve emotion classification for speakers never seen during
  classifier training when the reference frame is estimated from only 1, 2, 5, or 10 unlabeled
  enrollment utterances?

registered_hypothesis: >
  Speaker-relative pitch should retain part of the prosody-only emotion advantage under
  speaker-disjoint evaluation, but the benefit should depend on reference quality. Increasing the
  enrollment budget from K=1 to K=10 should reduce speaker-baseline estimation error and improve
  relative-pitch emotion classification. Hybrid absolute-plus-relative pitch may be more robust
  than either frame alone at low K.

