schema_version: 1
experiment_id: EXP-20260920-05
title: Label-free K-shot relative pitch for unseen speakers

research_question: >
  When test speakers are entirely unseen, how much label-free reference audio is required to
  estimate a useful speaker pitch baseline, and how close can K-shot relative pitch get to the
  oracle speaker-relative representation?

registered_hypothesis: >
  Increasing the number of label-free enrollment utterances will reduce speaker-baseline
  estimation error. By K=10, K-shot relative pitch should recover a substantial part of the
  oracle-relative emotion advantage over matched absolute pitch in at least two controlled
  corpora.

