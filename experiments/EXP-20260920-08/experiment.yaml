title: Why does MSP prefer absolute pitch?

research_question: >
  Is MSP's absolute-pitch advantage explained by emotion-relevant information carried in the
  stable speaker baseline that speaker-relative normalization removes?

registered_hypothesis: >
  On MSP, adding the speaker baseline back to relative pitch will recover a substantial amount
  of emotion performance under speaker-disjoint evaluation, and baseline alone will retain
  non-trivial emotion-predictive information.

