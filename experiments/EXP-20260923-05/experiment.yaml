title: Corrected full-prosody K-shot recovery with speaker-cluster inference

research_question: >
  After repairing enrollment randomization and using speaker-cluster uncertainty, how much of the
  standard absolute-VAD Hybrid benefit can 20 or 50 unlabeled enrollment utterances recover?

registered_hypothesis: >
  Distinct seeds will yield genuinely different enrollment pools. K20 and K50 Hybrid will remain
  better than Absolute for Arousal and Dominance, K50 will remain close to the marginal oracle, and
  uncertainty will be reported from paired speaker-cluster bootstrap rather than seed×fold pairs.

