title: Can unlabeled K-shot enrollment recover the full interpretable-prosody Hybrid benefit?

research_question: >
  After combining all six validated interpretable prosodic attributes, can a moderate unlabeled
  enrollment set recover the raw Arousal/Dominance Hybrid benefit without full-speaker oracle centers?

registered_hypothesis: >
  K=20 will already recover most of the usable Hybrid benefit: it will exceed Absolute for both
  Arousal and Dominance, K=20-to-K=50 gains will be below 0.01 CCC for both targets, and K=50
  will lie within 0.01 CCC of the full-speaker marginal-oracle Hybrid for both targets.

