experiment_id: EXP-20260920-11
title: Can simple statistics predict which prosodic reference frame will work better?

research_question: >
  Can raw acoustic/class statistics predict the sign and magnitude of Relative-versus-Absolute
  downstream emotion performance on a held-out corpus or held-out attribute?

registered_hypothesis: >
  Relative-frame preference will be predictable from the balance between within-speaker class
  separation and stable speaker-baseline/class-prior association. A combined statistical model
  should generalize better than attribute/emotion labels alone.

