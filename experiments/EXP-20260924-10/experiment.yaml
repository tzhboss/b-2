schema_version: 1
experiment_id: EXP-20260924-10
title: Nested session-LOSO component-aware recomposition versus ensemble and PLDC baselines
research_question: >
  Does the Overall/Between/Within decomposition provide actionable information for standard absolute SER,
  such that a component-aware recomposition can improve both Between-speaker calibration and Within-speaker
  tracking relative to strong single-model, generic ensemble, and published-style PLDC calibration baselines?
registered_hypothesis: >
  Under strict nested IEMOCAP session LOSO with label-free K=10 enrollment, the preregistered
  component-aware PLDC mu+sigma recomposition will have positive point deltas versus nested best-single
  absolute SER on Overall, Between, and Within for at least one target, while ordinary equal/convex
  ensembles and single-model PLDC provide controls for generic ensembling and personalization.
