experiment_id: EXP-20260923-01
title: Standard absolute SER Overall/Between/Within diagnostic decomposition

research_question: >
  When models are trained and evaluated on the ordinary absolute VAD task, do conventional Overall
  scores hide distinct between-speaker calibration and within-speaker affect-tracking abilities?

registered_hypothesis: >
  Speaker-relative representations will improve Within diagnostics while sacrificing Between
  calibration, whereas Hybrid representations will recover Between information. Therefore the
  representation preferred by Overall CCC need not be the representation preferred for Within
  affect tracking.

