schema_version: 1
experiment_id: EXP-20260920-07
title: Natural-corpus validation of speaker-relative pitch

research_question: >
  Does speaker-relative pitch remain useful on MSP-Podcast and MELD under speaker-disjoint,
  class-imbalanced, long-tailed natural-speech evaluation?

registered_hypothesis: >
  Oracle speaker-relative pitch will retain a positive emotion advantage over absolute pitch on
  both natural corpora. Ten label-free enrollment utterances will recover much of this advantage,
  although the effect is expected to be smaller and noisier than on controlled corpora.

