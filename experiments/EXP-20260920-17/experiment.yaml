experiment_id: EXP-20260920-17
title: Does VAD itself contain speaker-level and within-speaker components?

research_question: >
  Is the Absolute/Hybrid advantage for MSP Arousal and Dominance driven by between-speaker VAD
  structure that stable prosodic baselines can predict, while Relative prosody better tracks
  within-speaker VAD residuals?

registered_hypothesis: >
  Arousal and Dominance will contain meaningful between-speaker variance. Stable prosodic baselines
  will predict part of the speaker-level mean, while speaker-relative features will recover
  relative advantage after speaker-mean VAD is removed from the target.

