title: Component-balanced maximin ensemble under nested session LOSO
research_question: >
  Can the Overall/Between/Within decomposition directly guide ensemble weighting so that a standard
  absolute SER system improves both Between-speaker calibration and Within-speaker tracking rather
  than merely improving Overall CCC?
registered_hypothesis: >
  Under strict nested IEMOCAP session LOSO, a component-balanced maximin convex ensemble chosen only
  on inner folds will obtain positive point deltas over nested best-single on Overall, Between, and
  Within for at least one target, and will not be dominated by the ordinary Overall-optimized convex ensemble.
