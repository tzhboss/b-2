experiment_id: EXP-20260920-12
title: Can held-out-corpus statistics route each emotion to the better reference frame?

research_question: >
  Do EXP-11 out-of-sample preference predictions produce a practical Absolute/Relative router
  that improves achieved speaker-balanced F1 and reduces regret relative to fixed policies?

registered_hypothesis: >
  Because stats-only LOCO predicts reference-frame direction well and large negative cells are
  concentrated in specific corpus/attribute/emotion combinations, adaptive routing should beat
  always-Absolute and always-Relative policies and recover a substantial fraction of oracle gain.

