title: Speaker-cluster inference for the main target-reference effect

research_question: >
  Does the Pitch+Rate target-reference coupling remain robust when uncertainty is computed by
  resampling speakers rather than fold/seed aggregate scores?

registered_hypothesis: >
  MSP Arousal/Dominance Relative-minus-Absolute slopes will remain significantly negative under
  speaker-cluster bootstrap for both Linear and Quadratic Ridge. IEMOCAP mean slopes will retain
  the negative direction, with wider uncertainty due to only 10 speakers.

