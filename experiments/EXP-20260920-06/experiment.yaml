experiment_id: EXP-20260920-06
title: Frozen WavLM plus K-shot relative pitch for unseen speakers

research_question: >
  Does explicit K-shot speaker-relative pitch still improve emotion classification beyond frozen
  WavLM when speakers are disjoint between classifier train and test?

registered_hypothesis: >
  The large K-shot relative-pitch advantage from EXP-20260920-05 will shrink after adding WavLM,
  but a measurable benefit should remain under unseen-speaker evaluation because WavLM final-layer
  embeddings do not explicitly normalize each unseen speaker using enrollment audio. K=10 should
  outperform K=1 if reference quality remains relevant after conditioning on WavLM.

