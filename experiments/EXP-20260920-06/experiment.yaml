experiment_id: EXP-20260920-06
title: What speaker reference does label-free K-shot pitch estimate?

research_question: >
  Is the strong unseen-speaker K-shot emotion result from EXP-05 explained by label-free
  enrollment converging toward a speaker marginal pitch center rather than the neutral oracle
  reference?

registered_hypothesis: >
  Random label-free K-shot medians will converge toward the full unlabeled speaker marginal median,
  not necessarily toward the neutral-derived reference. The marginal-reference relative feature
  will retain emotion utility comparable to the neutral-oracle relative feature.

