experiment_id: EXP-20260920-19
title: Can unlabeled K-shot speaker audio recover raw VAD baseline utility?

research_question: >
  Can K unlabeled enrollment utterances from an unseen speaker estimate a useful acoustic center
  and recover the raw Arousal/Dominance advantage of Hybrid prosody?

registered_hypothesis: >
  K-shot center estimation error will shrink with K. By K=10, Hybrid K-shot features will improve
  raw Arousal and Dominance over Absolute and approach a full marginal-speaker oracle.

