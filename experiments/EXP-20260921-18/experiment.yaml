title: Can unlabeled K-shot enrollment recover WavLM reference-frame matching?

research_question: >
  Can a small unlabeled enrollment set estimate speaker-specific WavLM centers well enough to
  recover the target-reference effect without full-speaker oracle centers?

registered_hypothesis: >
  K=20 will preserve the negative target-reference slope direction in all four layer-by-target
  cells, and K=50 will approach the oracle slope in most cells.

