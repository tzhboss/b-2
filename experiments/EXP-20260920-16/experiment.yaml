experiment_id: EXP-20260920-16
title: Absolute versus speaker-relative prosody for continuous MSP VAD

research_question: >
  Do prosodic reference frames affect continuous Valence, Arousal, and Dominance prediction
  differently under speaker-disjoint MSP-Podcast evaluation?

registered_hypothesis: >
  Speaker-relative prosody will be more useful for Arousal than for Valence, because within-speaker
  pitch/loudness/rate deviations more directly track activation. Dominance is left less constrained.
  Baseline restoration is expected to help some target-attribute cells rather than universally.

