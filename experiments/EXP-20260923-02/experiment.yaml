title: Cross-model Overall/Between/Within profiles on IEMOCAP

research_question: >
  On the unchanged standard absolute VAD task, do hand-engineered Pitch+Rate and frozen WavLM
  models have different Overall, Between-speaker, and Within-speaker performance profiles?

registered_hypothesis: >
  Model ranking under conventional Overall CCC will not fully determine ranking under Within-speaker
  CCC; at least one target will show a ranking change, indicating that a single Overall score hides
  distinct capabilities.

