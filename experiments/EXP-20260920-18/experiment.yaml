schema_version: 1
experiment_id: EXP-20260920-18
title: Do VAD reference-frame effects survive low annotator disagreement?

research_question: >
  Are the raw-VAD baseline advantage and within-speaker Relative advantage robust when evaluation
  is restricted to MSP utterances on which human annotators agree more strongly?

registered_hypothesis: >
  Both mechanisms will persist in the low-disagreement stratum: raw Arousal/Dominance will retain
  strong baseline utility, while within-speaker Arousal/Dominance residuals will retain a Relative
  advantage. Overall prediction quality should degrade as annotator disagreement increases.

